<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="tireGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4a4a4a"/>
      <stop offset="70%" style="stop-color:#2a2a2a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </radialGradient>
    <radialGradient id="rimGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e5e5e5"/>
      <stop offset="70%" style="stop-color:#c0c0c0"/>
      <stop offset="100%" style="stop-color:#a0a0a0"/>
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="#f8f8f8" stroke="#e5e5e5" stroke-width="2"/>
  
  <!-- Outer tire -->
  <circle cx="200" cy="200" r="160" fill="url(#tireGradient)" stroke="#1a1a1a" stroke-width="4"/>
  
  <!-- Tire tread pattern -->
  <g fill="none" stroke="#000" stroke-width="3" opacity="0.6">
    <!-- Radial tread lines -->
    <g transform="translate(200,200)">
      <g transform="rotate(0)"><line x1="130" y1="0" x2="155" y2="0"/></g>
      <g transform="rotate(30)"><line x1="130" y1="0" x2="155" y2="0"/></g>
      <g transform="rotate(60)"><line x1="130" y1="0" x2="155" y2="0"/></g>
      <g transform="rotate(90)"><line x1="130" y1="0" x2="155" y2="0"/></g>
      <g transform="rotate(120)"><line x1="130" y1="0" x2="155" y2="0"/></g>
      <g transform="rotate(150)"><line x1="130" y1="0" x2="155" y2="0"/></g>
      <g transform="rotate(180)"><line x1="130" y1="0" x2="155" y2="0"/></g>
      <g transform="rotate(210)"><line x1="130" y1="0" x2="155" y2="0"/></g>
      <g transform="rotate(240)"><line x1="130" y1="0" x2="155" y2="0"/></g>
      <g transform="rotate(270)"><line x1="130" y1="0" x2="155" y2="0"/></g>
      <g transform="rotate(300)"><line x1="130" y1="0" x2="155" y2="0"/></g>
      <g transform="rotate(330)"><line x1="130" y1="0" x2="155" y2="0"/></g>
    </g>
    
    <!-- Circumferential lines -->
    <circle cx="200" cy="200" r="140" stroke="#000" stroke-width="2" opacity="0.4"/>
    <circle cx="200" cy="200" r="150" stroke="#000" stroke-width="2" opacity="0.4"/>
  </g>
  
  <!-- Inner rim -->
  <circle cx="200" cy="200" r="80" fill="url(#rimGradient)" stroke="#a0a0a0" stroke-width="3"/>
  
  <!-- Rim spokes -->
  <g fill="#d0d0d0" stroke="#a0a0a0" stroke-width="2">
    <g transform="translate(200,200)">
      <!-- 5 spoke pattern -->
      <g transform="rotate(0)">
        <path d="M 0,0 L 60,0 L 55,10 L 55,-10 Z"/>
      </g>
      <g transform="rotate(72)">
        <path d="M 0,0 L 60,0 L 55,10 L 55,-10 Z"/>
      </g>
      <g transform="rotate(144)">
        <path d="M 0,0 L 60,0 L 55,10 L 55,-10 Z"/>
      </g>
      <g transform="rotate(216)">
        <path d="M 0,0 L 60,0 L 55,10 L 55,-10 Z"/>
      </g>
      <g transform="rotate(288)">
        <path d="M 0,0 L 60,0 L 55,10 L 55,-10 Z"/>
      </g>
    </g>
  </g>
  
  <!-- Center cap -->
  <circle cx="200" cy="200" r="25" fill="#c0c0c0" stroke="#a0a0a0" stroke-width="2"/>
  <circle cx="200" cy="200" r="15" fill="#e0e0e0"/>
  
  <!-- Subtle text -->
  <text x="200" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#888">
    No Image Available
  </text>
</svg>